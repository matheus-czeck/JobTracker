<p-confirmDialog></p-confirmDialog>

<div class="list-container">
  <header class="header-container">
    <div class="title-area">
      <h2>Minhas Candidaturas</h2>
      <p class="subtitle">
        Gerencie e acompanhe seus processos seletivos em tempo real
      </p>
    </div>

    <button
      pButton
      (click)="openCreate()"
      label="Nova Vaga"
      icon="pi pi-plus"
      class="add-job-btn"
    ></button>

    <p-dialog
      header="Cadastrar Nova Vaga"
      [(visible)]="displayDialog"
      [modal]="true"
      [style]="{ width: '420px' }"
      styleClass="custom-dialog"
    >
      <app-job-form (saved)="onSaved()"></app-job-form>
    </p-dialog>

    <p-dialog
      header="Editar Vaga"
      [(visible)]="displayEditDialog"
      [modal]="true"
      [style]="{ width: '500px' }"
      styleClass="custom-dialog"
    >
      <app-job-edit
        *ngIf="selectedJob"
        [job]="selectedJob"
        (saved)="onSaved()"
      >
      </app-job-edit>
    </p-dialog>

    <p-dialog
      header="Detalhes da Vaga"
      [(visible)]="displayDetailDialog"
      [modal]="true"
      [style]="{ width: '550px' }"
      styleClass="custom-dialog"
    >
      <app-job-detail
        *ngIf="selectedJob"
        [job]="selectedJob"
      >
      </app-job-detail>
    </p-dialog>
  </header>

  <section class="filter-bar">
    <div class="filter-group text-search">
      <i class="pi pi-search search-icon"></i>

      <input
        pInputText
        type="text"
        [(ngModel)]="searchTerm"
        (input)="applyFilters()"
        placeholder="Buscar por empresa ou cargo..."
      />
    </div>

    <div class="filter-group status-search">
      <p-dropdown
        [options]="statusOrder"
        [(ngModel)]="selectedStatus"
        (onChange)="applyFilters()"
        placeholder="Todos os status"
        styleClass="modern-dropdown"
      >
      </p-dropdown>
    </div>

    <div class="filter-group action-search">
      <button
        pButton
        label="Limpar"
        icon="pi pi-filter-slash"
        class="p-button-outlined p-button-secondary clear-btn"
        (click)="clearFilters()"
      ></button>
    </div>
  </section>

  <main class="table-card">
    <p-table [value]="filteredJobs" styleClass="p-datatable-striped-custom">

      <ng-template pTemplate="header">
        <tr>
          <th>Empresa</th>
          <th>Título do Cargo</th>
          <th>Status Atual</th>
          <th class="text-right" style="width: 15%">Ações</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-job>
        <tr>

          <td class="company-cell">
            {{ job.company }}
          </td>

          <td class="title-cell">
            {{ job.title }}
          </td>

          <td>
            <span
              class="status-badge"
              [attr.data-status]="job.currentStatus"
            >
              {{ job.currentStatus | replaceUnderscore }}
            </span>
          </td>

          <td>
            <div class="action-buttons">

              <button
                pButton
                icon="pi pi-eye"
                class="p-button-rounded p-button-text btn-view"
                pTooltip="Ver detalhes"
                tooltipPosition="top"
                (click)="openDetails(job)"
              >
              </button>

              <button
                pButton
                icon="pi pi-pencil"
                class="p-button-rounded p-button-text btn-edit"
                pTooltip="Editar vaga"
                tooltipPosition="top"
                (click)="openEdit(job)"
              >
              </button>

              <button
                pButton
                icon="pi pi-trash"
                class="p-button-rounded p-button-text btn-delete"
                pTooltip="Excluir vaga"
                tooltipPosition="top"
                (click)="delete(job.id)"
              >
              </button>

            </div>
          </td>

        </tr>
      </ng-template>

    </p-table>
  </main>

</div>
